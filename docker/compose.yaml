# Give every user and checkout an isolated Compose project, allowing multiple
# copies of the repository to run on the same machine without name collisions.
name: ${BUILDER_USER}-${WORKSPACE_ID}

services:
  halloween:
    # Retaining a named local image makes the CLI and devcontainer use the same
    # image while still rebuilding automatically when Dockerfile inputs change.
    image: ${BUILDER_USER}-${WORKSPACE_ID}-dev
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      # Generated by setupDockerEnv.sh. It supplies the host identity used by
      # the entrypoint and the absolute path used by the bind mount below.
      - .env
    volumes:
      # Keep the host's absolute workspace path inside the container. This
      # avoids path differences between dockerw and the devcontainer terminal.
      - ..:${PROJECT_DIR}:cached
    # The devcontainer attaches to this long-running process. dockerw overrides
    # it with the command it was asked to run.
    command: sleep infinity
